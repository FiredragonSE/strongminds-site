<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Strong Minds</title>
<meta name="theme-color" content="#0463CA">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head><body>
<header><div class="wrap bar">
<a class="logo" href="index.html">Strong <span>Minds</span></a>
<button class="menu" type="button" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
<nav id="nav">
<a href="strategic-advisory.html">Strategic Advisory</a>
<a href="intel-insights.html">Intel & Insights</a>
<a href="global-growth.html">Accelerate Growth</a>

<a class="btn" href="contact.html">Contact</a>
</nav></div></header>

<section class="hero"><img src="images/header-bridge.jpg" alt="Coastal bridge"><div class="shade"></div>
<div class="wrap copy"><p class="kicker">Contact</p><h1>Get in touch.</h1></div></section>
<section><div class="wrap contact">
<form id="note">
<label>Name<input required name="name" autocomplete="name"></label>
<label>Email<input required type="email" name="email" autocomplete="email"></label>
<label>Company<input name="company" autocomplete="organization"></label>
<label>Message<textarea required name="message" placeholder="How can we help?"></textarea></label>
<input name="company_url" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<button class="btn" type="submit">Send</button>
<p class="muted" id="note-status"></p>
</form>
<p style="text-align:center;font-family:Newsreader,Georgia,serif;font-size:2rem;margin:2.5rem 0 0"><a style="text-decoration:none" href="tel:+46763132544">+46 76 313 25 44</a></p>
<img class="photo" src="images/header-fjord.jpg" alt="Nordic fjord"></div></section>

<footer><div class="wrap foot"><div>Strongminds AB · Org.nr 556911-0355 · Stockholm</div>
<div><a href="contact.html">Contact</a></div></div></footer>
<script>
document.getElementById('note').onsubmit = async function (e) {
  e.preventDefault();
  var f = e.target;
  var status = document.getElementById('note-status');
  var data = Object.fromEntries(new FormData(f).entries());
  if (data.company_url) { status.textContent = 'Sent.'; f.reset(); return; }
  status.textContent = 'Sending\u2026';
  try {
    var res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error();
    f.reset();
    status.textContent = 'Sent.';
  } catch (err) {
    status.textContent = 'That did not go through. Try again.';
  }
};
</script>
</body></html>
