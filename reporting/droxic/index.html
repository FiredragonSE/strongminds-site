<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Droxic Sales — Strong Minds</title>
<meta name="theme-color" content="#0463CA">
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  .gate { min-height:100vh; position:relative; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem; }
  .gate img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gate .shade { position:absolute; inset:0; background:rgba(18,35,63,.45); }
  .panel { position:relative; width:min(28rem,100%); background:#fff; border-radius:.75rem; padding:2rem 1.6rem 1.7rem; box-shadow:0 12px 40px rgba(18,35,63,.25); }
  .panel h1 { font-size:2.4rem; margin:.2rem 0 0; }
  .panel form { display:flex; flex-direction:column; gap:.8rem; margin-top:1.4rem; }
  .panel input { width:100%; border:1px solid var(--line); padding:.8rem; font:inherit; }
  .panel .btn { width:100%; }
  .back { display:inline-block; margin-top:1.1rem; color:var(--accent); text-decoration:none; font-size:.9rem; }

  body.report-on .gate { display:none; }
  #report { display:none; }
  body.report-on #report { display:block; }
  .rhero { position:relative; min-height:min(68vh,42rem); color:#fff; overflow:hidden; display:flex; align-items:flex-end; }
  .rhero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .rhero .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(18,35,63,.25) 0%,rgba(18,35,63,.55) 55%,rgba(18,35,63,.86) 100%); }
  .rhero .copy { position:relative; width:100%; padding:7rem 0 7.5rem; }
  .rhero h1 { max-width:16ch; }
  .rhero .sub { max-width:38rem; font-size:1.15rem; margin:1.1rem 0 0; opacity:.95; }
  .rhero .asof { display:inline-block; margin-top:1.4rem; padding:.35rem .8rem; border:1px solid rgba(255,255,255,.55); border-radius:2rem; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; }
  .kpis { display:grid; gap:1rem; grid-template-columns:repeat(2,1fr); margin-top:-5rem; position:relative; z-index:2; }
  .kpis .kpi:last-child { grid-column:span 2; }
  @media (min-width:1000px) { .kpis { grid-template-columns:repeat(5,1fr); } .kpis .kpi:last-child { grid-column:auto; } }
  .kpi { background:#fff; border-top:4px solid var(--accent); border-radius:.4rem; padding:1.3rem 1.3rem 1.1rem; box-shadow:0 10px 30px rgba(18,35,63,.16); }
  .kpi .v { font-family:Newsreader,Georgia,serif; font-size:clamp(2.2rem,5vw,3.2rem); line-height:1; color:var(--accent); margin:0; }
  .kpi .l { margin:.5rem 0 0; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); }
  .kpi .n { margin:.35rem 0 0; font-size:.85rem; color:var(--muted); }
  .lis { display:grid; gap:1rem; grid-template-columns:repeat(2,1fr); align-content:start; }
  .lis .kpi { box-shadow:0 1px 2px rgba(18,35,63,.07); }
  .lis .kpi .v { font-size:clamp(1.8rem,3.4vw,2.4rem); }
  .kpi.warm { border-top-color:#1f9d6b; } .kpi.warm .v { color:#1f9d6b; }
  .sec { padding:3.2rem 0 0; }
  .sec h2 { font-size:clamp(1.8rem,3.4vw,2.4rem); }
  .sec .lede { color:var(--muted); max-width:42rem; margin:.5rem 0 0; }
  .grid2 { display:grid; gap:1.4rem; margin-top:1.6rem; }
  @media (min-width:900px) { .grid2 { grid-template-columns:1.1fr .9fr; } }
  .panelc { background:#fff; border-radius:.6rem; padding:1.5rem; box-shadow:0 1px 2px rgba(18,35,63,.07); }
  .panelc h3 { margin:0 0 1rem; font-size:1.35rem; }
  table.t { width:100%; border-collapse:collapse; font-size:.98rem; }
  table.t th { text-align:right; font-weight:500; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:.5rem .5rem; border-bottom:2px solid var(--line); }
  table.t th:first-child, table.t td:first-child { text-align:left; }
  table.t td { text-align:right; padding:.7rem .5rem; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  table.t tr.tot td { font-weight:600; border-top:2px solid var(--ink); border-bottom:0; color:var(--ink); }
  table.t tr.early td { color:var(--muted); font-style:italic; }
  .na { color:var(--muted); font-size:.82rem; }
  .tscroll { overflow-x:auto; }
  .chart { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; align-items:end; height:15rem; padding-top:.5rem; }
  .col { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .bars { display:flex; align-items:flex-end; gap:.35rem; height:calc(100% - 2rem); width:100%; justify-content:center; }
  .bar1 { width:34%; max-width:3.2rem; border-radius:.3rem .3rem 0 0; position:relative; min-height:2px; }
  .bar1 b { position:absolute; top:-1.4rem; left:50%; transform:translateX(-50%); font-size:.78rem; font-weight:500; color:var(--ink); white-space:nowrap; }
  .c-ft { background:var(--accent); } .c-fu { background:#8fb9e6; }
  .col .ml { margin-top:.5rem; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .legend { display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:1rem; font-size:.85rem; color:var(--muted); }
  .legend i { display:inline-block; width:.8rem; height:.8rem; border-radius:.2rem; margin-right:.4rem; vertical-align:-1px; }
  .split { display:flex; height:1.6rem; border-radius:.35rem; overflow:hidden; margin:.8rem 0 .4rem; background:var(--line); }
  .split span { display:block; height:100%; }
  .s-hard { background:#12233f; } .s-soft { background:#7fa6d6; } .s-pos { background:#1f9d6b; } .s-oth { background:#c9d3e0; }
  .rrow { display:flex; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid var(--line); font-size:.98rem; }
  .rrow:last-child { border-bottom:0; }
  .rrow b { font-family:Newsreader,Georgia,serif; font-size:1.3rem; font-weight:500; }
  .rrow small { display:block; color:var(--muted); font-size:.8rem; }
  .meet { background:linear-gradient(135deg,#0463CA,#0a3f86); color:#fff; border-radius:.6rem; padding:1.7rem; display:grid; gap:.6rem; }
  .meet .k { letter-spacing:.2em; text-transform:uppercase; font-size:.75rem; opacity:.85; }
  .meet .big { font-family:Newsreader,Georgia,serif; font-size:2.1rem; line-height:1.05; }
  .meet p { margin:0; opacity:.95; }
  .summary { background:#fff; border-left:4px solid var(--accent); border-radius:.4rem; padding:1.4rem 1.6rem; margin-top:1.4rem; box-shadow:0 1px 2px rgba(18,35,63,.07); }
  .summary p { margin:.5rem 0; max-width:50rem; }
  .notes { color:var(--muted); font-size:.9rem; padding:0 0 0 1.1rem; max-width:52rem; }
  .notes li { margin:.35rem 0; }
  .rfoot { padding:3rem 0 3rem; }
  .rfoot a { color:var(--accent); text-decoration:none; }
</style>
</head><body>
<section class="gate">
<img class="bg" src="../../images/header-nordic.jpg" alt="Nordic lake">
<div class="shade"></div>
<div class="panel" id="panel">
<a class="logo" href="../../index.html">Strong <span>Minds</span></a>
<p class="kicker" style="margin-top:1.2rem">Reporting</p>
<h1>Droxic Sales</h1>
<form id="gate">
<label>Code<input type="password" name="code" autocomplete="current-password" required></label>
<button class="btn" type="submit">Enter</button>
<p class="muted" id="gate-status"></p>
</form>
</div>
</section>
<div id="report">
<header><div class="wrap bar"><a class="logo" href="../../index.html">Strong <span>Minds</span></a><nav><a href="../">Reporting</a></nav></div></header>
<section class="rhero" style="padding:0">
<img src="../../images/header-fjord.jpg" alt="Nordic fjord landscape at dusk">
<div class="shade"></div>
<div class="wrap copy">
<p class="kicker">Reporting</p>
<h1>Droxic Sales</h1>
<p class="sub" id="r-sub"></p>
<span class="asof" id="r-asof"></span>
</div>
</section>
<main class="wrap" id="r-main"></main>
</div>
<script>
function esc(v) { return String(v).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmt(n) { return (n === null || n === undefined) ? '<span class="na">not tracked</span>' : Number(n).toLocaleString("en-GB"); }
function renderReport(r) {
  var T = r.totals, M = r.months, E = r.earlierReplies;
  document.getElementById("r-sub").textContent = r.subtitle;
  document.getElementById("r-asof").textContent = "Status " + r.asOf + " \u00b7 " + r.period;
  var maxv = 0; M.forEach(function (m) { maxv = Math.max(maxv, m.firstTouchEmails, m.followUps); });
  var chart = M.map(function (m) {
    return '<div class="col"><div class="bars">' +
      '<div class="bar1 c-ft" style="height:' + (100 * m.firstTouchEmails / maxv) + '%"><b>' + fmt(m.firstTouchEmails) + '</b></div>' +
      '<div class="bar1 c-fu" style="height:' + (100 * m.followUps / maxv) + '%"><b>' + fmt(m.followUps) + '</b></div>' +
      '</div><div class="ml">' + esc(m.month) + '</div></div>';
  }).join("");
  var rows = M.map(function (m) {
    return "<tr><td>" + esc(m.month) + (m.month === "Nov" ? ' <span class="na">(to 20 Nov)</span>' : "") + "</td><td>" + fmt(m.firstTouchEmails) + "</td><td>" + fmt(m.followUps) + "</td><td>" + fmt(m.replies) + "</td><td>" + fmt(m.softNo) + "</td><td>" + fmt(m.hardNo) + "</td><td>" + fmt(m.meetings) + "</td></tr>";
  }).join("");
  var early = '<tr class="early"><td>Earlier, date not recorded</td><td>\u2013</td><td>\u2013</td><td>' + fmt(E.replies) + "</td><td>" + fmt(E.softNo) + "</td><td>" + fmt(E.hardNo) + "</td><td>\u2013</td></tr>";
  var tot = '<tr class="tot"><td>Total</td><td>' + fmt(T.firstTouchEmails) + "</td><td>" + fmt(T.followUps) + "</td><td>" + fmt(T.replies) + "</td><td>" + fmt(T.softNo) + "</td><td>" + fmt(T.hardNo) + "</td><td>" + fmt(T.meetings) + "</td></tr>";
  var L = r.linkedin || { status: "counting" }, liSec = "", liKpi = "";
  if (L.status === "final" && L.live) {
    var LM = L.live.months, LT = L.live.totals;
    var lr = LM.map(function (m) { return "<tr><td>" + esc(m.month) + (m.month === "Nov" ? ' <span class="na">(to 20 Nov)</span>' : "") + "</td><td>" + fmt(m.conversations) + "</td><td>" + fmt(m.replies) + "</td><td>~" + fmt(m.pendingInvites) + "</td><td>" + fmt(m.newConnections) + "</td></tr>"; }).join("");
    var approx = Math.round(LT.pendingInvites / 10) * 10;
    liKpi = '<div class="kpi"><p class="v">' + fmt(LT.conversations) + '</p><p class="l">LinkedIn conversations</p><p class="n">about ' + fmt(approx) + ' invites pending</p></div>';
    liSec = '<section class="sec"><h2>LinkedIn</h2><p class="lede">Counted by hand in LinkedIn on 20 November 2026.</p>' +
      '<div class="grid2"><div class="panelc"><h3>Month by month</h3><div class="tscroll"><table class="t"><thead><tr><th>Month</th><th>Prospect conversations</th><th>Replies (min.)</th><th>Pending invites</th><th>New connections</th></tr></thead><tbody>' + lr +
      '<tr class="tot"><td>Total</td><td>' + fmt(LT.conversations) + "</td><td>" + fmt(LT.replies) + "</td><td>~" + fmt(LT.pendingInvites) + "</td><td>" + fmt(LT.newConnections) + "</td></tr></tbody></table></div>" +
      '<p class="na" style="margin:1rem 0 0">Conversations are message threads, counted by the month of their latest activity. The true number of messages is higher because of follow-ups. Replies are threads where the prospect wrote last, so this is a minimum. Pending invites are approximate: LinkedIn only shows their age. New connections are all new connections, not only Droxic.</p></div>' +
      '<div class="lis"><div class="kpi"><p class="v">' + fmt(LT.conversations) + '</p><p class="l">Prospect conversations</p><p class="n">by latest activity</p></div>' +
      '<div class="kpi"><p class="v">' + fmt(LT.replies) + '</p><p class="l">Replies</p><p class="n">at least</p></div>' +
      '<div class="kpi"><p class="v">~' + fmt(LT.pendingInvites) + '</p><p class="l">Invites pending</p><p class="n">sent, not yet accepted</p></div>' +
      '<div class="kpi"><p class="v">' + fmt(LT.newConnections) + '</p><p class="l">New connections</p><p class="n">all, Sep to 20 Nov</p></div></div></div></section>';
  } else {
    liKpi = '<div class="kpi"><p class="v">\u2013</p><p class="l">LinkedIn</p><p class="n">being counted</p></div>';
    liSec = '<section class="sec"><h2>LinkedIn</h2><p class="lede"><b>Being counted.</b> The figures will appear here as soon as the count is done.</p></section>';
  }
  var pct = function (n) { return (100 * n / T.replies).toFixed(1) + "%"; };
  var oth = T.otherReplies;
  var html =
    '<div class="kpis">' +
    '<div class="kpi"><p class="v">' + fmt(T.firstTouchEmails) + '</p><p class="l">First-touch emails</p><p class="n">' + fmt(T.followUps) + ' follow-ups to ' + fmt(T.followUpPeople) + ' people</p></div>' +
    '<div class="kpi"><p class="v">' + fmt(T.replies) + '</p><p class="l">Email replies</p><p class="n">' + T.repliesPer100FirstTouchEmails + ' per 100 first-touch emails</p></div>' +
    '<div class="kpi"><p class="v">' + fmt(T.softNo + T.hardNo) + '</p><p class="l">Said no</p><p class="n">' + fmt(T.hardNo) + ' not interested, ' + fmt(T.softNo) + ' not now</p></div>' +
    '<div class="kpi warm"><p class="v">' + fmt(T.meetings) + '</p><p class="l">Meeting booked</p><p class="n">' + esc(r.meeting.company) + ', Mon 23 Nov</p></div>' + liKpi +
    '</div>' +
    '<section class="sec"><h2>Month by month</h2><p class="lede">Emails sent from the Droxic mailbox, counted once per person and day.</p>' +
    '<div class="grid2"><div class="panelc"><h3>Overview</h3><div class="tscroll"><table class="t"><thead><tr><th>Month</th><th>First touch</th><th>Follow-ups</th><th>Replies</th><th>Not now</th><th>Not interested</th><th>Meetings</th></tr></thead><tbody>' + rows + early + tot + '</tbody></table></div></div>' +
    '<div class="panelc"><h3>Emails sent</h3><div class="chart">' + chart + '</div><div class="legend"><span><i class="c-ft"></i>First touch</span><span><i class="c-fu"></i>Follow-ups</span></div></div></div></section>' +
    '<section class="sec"><h2>Replies</h2><p class="lede">Email replies from people, counted once per person. Out-of-office and automatic replies are not included.</p>' +
    '<div class="grid2"><div class="panelc"><h3>' + fmt(T.replies) + ' people replied by email</h3>' +
    '<div class="split"><span class="s-hard" style="width:' + pct(T.hardNo) + '"></span><span class="s-soft" style="width:' + pct(T.softNo) + '"></span><span class="s-pos" style="width:' + pct(T.positive) + '"></span><span class="s-oth" style="width:' + pct(oth) + '"></span></div>' +
    '<div class="legend"><span><i class="s-hard"></i>Not interested</span><span><i class="s-soft"></i>Not now</span><span><i class="s-pos"></i>Interested</span><span><i class="s-oth"></i>Other</span></div>' +
    '<div style="margin-top:1rem"><div class="rrow"><span>Not interested<small>Flat no, unsubscribe. Never contacted again.</small></span><b>' + fmt(T.hardNo) + '</b></div>' +
    '<div class="rrow"><span>Not now<small>Not now, or happy with the current team</small></span><b>' + fmt(T.softNo) + '</b></div>' +
    '<div class="rrow"><span>Interested<small>Open to a conversation</small></span><b>' + fmt(T.positive) + '</b></div>' +
    '<div class="rrow"><span>Other<small>Left the company, a question, or the wording was not logged</small></span><b>' + fmt(oth) + '</b></div>' +
    '</div></div>' +
    '<div><div class="meet"><span class="k">Meeting</span><span class="big">' + esc(r.meeting.company) + '</span><p>' + esc(r.meeting.contact) + '</p><p>' + esc(r.meeting.when) + '</p></div></div></div></section>' + liSec +
    '<section class="sec"><h2>In short</h2><div class="summary">' + r.summary.map(function (x) { return "<p>" + esc(x) + "</p>"; }).join("") + '</div></section>' +
    '<section class="sec"><h2>How to read this</h2><ul class="notes">' + r.notes.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></section>' +
    '<div class="rfoot"><a href="../">Back to Reporting</a></div>';
  document.getElementById("r-main").innerHTML = html;
  document.body.classList.add("report-on");
  window.scrollTo(0, 0);
}
function showInside(data) {
  if (data && data.report) { renderReport(data.report); return; }
  document.getElementById("panel").innerHTML =
    '<a class="logo" href="../../index.html">Strong <span>Minds</span></a>' +
    '<p class="kicker" style="margin-top:1.2rem">Reporting</p>' +
    '<h1>Droxic Sales</h1>' +
    '<p style="margin-top:.8rem">The report is not available right now.</p>' +
    '<a class="back" href="../">Back to Reporting</a>';
}
document.getElementById("gate").onsubmit = async function (e) {
  e.preventDefault();
  var status = document.getElementById("gate-status");
  status.textContent = "";
  var code = new FormData(e.target).get("code");
  var res = await fetch("/api/reporting-droxic", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({ code: code })
  });
  if (!res.ok) {
    status.textContent = "That code is not right.";
    return;
  }
  showInside(await res.json());
};
fetch("/api/reporting-droxic", { credentials: "same-origin" }).then(function (res) {
  if (res.ok) return res.json().then(showInside);
});
</script>
</body></html>
