<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starck Technologies · October–November 2026</title>
<meta name="theme-color" content="#0463CA">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<style>
  .gate { min-height:100vh; position:relative; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem; }
  .gate img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gate .shade { position:absolute; inset:0; background:rgba(18,35,63,.45); }
  .panel { position:relative; width:min(28rem,100%); background:#fff; border-radius:.75rem; padding:2rem 1.6rem 1.7rem; box-shadow:0 12px 40px rgba(18,35,63,.25); }
  .panel h1 { font-size:2.4rem; margin:.2rem 0 0; }
  .panel p { margin:.7rem 0 0; }
  .panel form { display:flex; flex-direction:column; gap:.8rem; margin-top:1.4rem; }
  .panel input { width:100%; border:1px solid var(--line); padding:.8rem; font:inherit; }
  .panel .btn { width:100%; }

  .rep { display:none; }
  .rep.on { display:block; }
  .rep-hero { background:linear-gradient(135deg,#0b1d3a 0%,#12233f 55%,#0463CA 160%); color:#fff; padding:3.2rem 0 5.5rem; }
  .rep-hero h1 { font-size:clamp(2.2rem,5vw,3.4rem); max-width:none; }
  .rep-hero p { margin:.8rem 0 0; opacity:.85; max-width:40rem; }
  .rep main { margin-top:-3.6rem; padding-bottom:3rem; }
  .kpis { display:grid; gap:1rem; grid-template-columns:repeat(2,1fr); }
  @media (min-width:700px) { .kpis { grid-template-columns:repeat(3,1fr); } }
  .kpis .kpi:last-child:nth-child(odd) { grid-column:1 / -1; }
  @media (min-width:700px) { .kpis .kpi:last-child:nth-child(odd) { grid-column:auto; } }
  .kpi { background:var(--card); border-top:4px solid var(--accent); border-radius:.4rem; padding:1.2rem 1.2rem 1.1rem; box-shadow:0 8px 24px rgba(18,35,63,.12); }
  .kpi .lbl { font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0; }
  .kpi .big { font-family:Newsreader,Georgia,serif; font-size:clamp(2.4rem,6vw,3.5rem); line-height:1; color:var(--ink); margin:.5rem 0 .4rem; }
  .kpi .sub { font-size:.85rem; color:var(--muted); margin:0; }
  .kpi.no { border-top-color:#8a98ab; }
  .kpi.hot { border-top-color:#12233f; background:#12233f; }
  .kpi.hot .lbl, .kpi.hot .sub { color:rgba(255,255,255,.75); }
  .kpi.hot .big { color:#fff; }
  .rep h2 { font-size:clamp(1.5rem,3vw,2rem); margin:0 0 .3rem; }
  .rep .sec { padding:2.6rem 0 0; }
  .rep .hint { color:var(--muted); font-size:.9rem; margin:0 0 1.2rem; }
  .mgrid { display:grid; gap:1rem; }
  @media (min-width:700px) { .mgrid { grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1000px) { .mgrid { grid-template-columns:repeat(5,1fr); } }
  .mcard { background:var(--card); border-radius:.4rem; padding:1.1rem 1.2rem 1.2rem; box-shadow:0 1px 2px rgba(18,35,63,.08); }
  .mcard h3 { font-family:Outfit,system-ui,sans-serif; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 .9rem; font-weight:500; }
  .bar-row { display:grid; grid-template-columns:2.2rem 1fr 2.8rem; align-items:center; gap:.6rem; margin:.5rem 0; font-size:.9rem; }
  .bar-row .track { background:#e8eef7; border-radius:.25rem; height:1.1rem; overflow:hidden; }
  .bar-row .fill { height:100%; background:var(--accent); border-radius:.25rem; min-width:2px; }
  .bar-row:nth-child(3) .fill { background:#3d8ae0; }
  .bar-row:nth-child(4) .fill { background:#12233f; }
  .bar-row .v { text-align:right; font-weight:500; }
  .twocol { display:grid; gap:1.4rem; }
  @media (min-width:900px) { .twocol { grid-template-columns:1.5fr 1fr; align-items:start; } }
  .list { background:var(--card); border-radius:.4rem; box-shadow:0 1px 2px rgba(18,35,63,.08); }
  .list .it { display:flex; justify-content:space-between; gap:1rem; padding:.85rem 1.1rem; border-top:1px solid var(--line); }
  .list .it:first-child { border-top:0; }
  .list .it b { font-weight:500; }
  .list .it span.n { color:var(--muted); font-size:.88rem; display:block; }
  .tag { flex:none; align-self:flex-start; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); background:#e6f0fb; border-radius:99px; padding:.2rem .6rem; }
  .warm { background:var(--card); border-radius:.4rem; box-shadow:0 1px 2px rgba(18,35,63,.08); padding:1.2rem; }
  .warm .big { font-family:Newsreader,Georgia,serif; font-size:3rem; line-height:1; color:var(--accent); margin:0; }
  .warm table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:.9rem; }
  .warm th, .warm td { text-align:right; padding:.45rem .2rem; border-top:1px solid var(--line); }
  .warm th:first-child, .warm td:first-child { text-align:left; }
  .warm th { font-weight:500; color:var(--muted); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; border-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 0; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:99px; padding:.3rem .8rem; font-size:.9rem; }
  .chip.rfq { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.35); color:#fff; font-size:1.05rem; padding:.45rem 1rem; }
  .chip.get { border-color:var(--accent); color:var(--accent); font-weight:500; }
  .panel2 { background:var(--card); border-radius:.4rem; box-shadow:0 1px 2px rgba(18,35,63,.08); padding:1.2rem 1.3rem 1.4rem; }
  .panel2 h4 { font-family:Outfit,system-ui,sans-serif; font-weight:500; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:1.2rem 0 0; }
  .rfqbox { background:#12233f; color:#fff; border-radius:.4rem; padding:1.2rem 1.3rem 1.4rem; }
  .rfqbox .hint { color:rgba(255,255,255,.75); margin-bottom:.4rem; }
  .rfqbox h2 { color:#fff; }
  .mcard .bignum { font-family:Newsreader,Georgia,serif; font-size:3rem; line-height:1; color:#12233f; margin:.2rem 0 .4rem; }
  .mcard .small { color:var(--muted); font-size:.85rem; margin:0; }
  .notes { margin-top:2.4rem; color:var(--muted); font-size:.82rem; border-top:1px solid var(--line); padding-top:1rem; }
  .notes p { margin:.3rem 0; }
  .rep-top { background:rgba(243,246,251,.92); border-bottom:1px solid var(--line); }
  .back { display:inline-block; margin-top:1.1rem; color:var(--accent); text-decoration:none; font-size:.9rem; }
</style>
</head><body>
<section class="gate">
<img class="bg" src="../images/header-bridge.jpg" alt="Snow and a coastal bridge">
<div class="shade"></div>
<div class="panel" id="panel">
<a class="logo" href="../index.html">Strong <span>Minds</span></a>
<p class="kicker" style="margin-top:1.2rem">Reporting</p>
<h1>Reporting</h1>
<form id="gate">
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Enter</button>
<p class="muted" id="gate-status"></p>
</form>
</div>
</section>
<div class="rep" id="rep">
<div class="rep-top"><div class="wrap bar"><a class="logo" href="../index.html">Strong <span>Minds</span></a><span class="muted" style="font-size:.8rem;letter-spacing:.14em;text-transform:uppercase">Reporting</span></div></div>
<div class="rep-hero"><div class="wrap">
<p class="kicker">Starck Technologies &middot; October–November 2026</p>
<h1>October–November 2026</h1>
<p id="asof"></p>
</div></div>
<main class="wrap" id="repbody"></main>
</div>
<script>
function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    return "&" + "quot;";
  });
}
function nf(n) { return Number(n).toLocaleString("en-GB"); }
function bars(months, key) {
  var rows = months.filter(function (m) { return m[key] != null; });
  var max = Math.max.apply(null, rows.map(function (m) { return m[key]; })) || 1;
  return rows.map(function (m) {
    return '<div class="bar-row"><span>' + esc(m.label) + '</span><div class="track"><div class="fill" style="width:' +
      Math.max(2, Math.round(m[key] / max * 100)) + '%"></div></div><span class="v">' + nf(m[key]) + '</span></div>';
  }).join("");
}
function showReport(stats) {
  document.querySelector(".gate").style.display = "none";
  document.getElementById("rep").className = "rep on";
  window.scrollTo(0, 0);
  var body = document.getElementById("repbody");
  if (!stats) {
    body.innerHTML = '<div class="sec"><p>There are no figures on this page yet.</p></div>';
    return;
  }
  var t = stats.totals, ms = stats.months;
  document.getElementById("asof").textContent = "Sent figures to " + stats.asOf + ". Planned November follow-ups are listed separately and are not in the sent totals.";
  var kpi = function (cls, lbl, big, sub) {
    var shown = (typeof big === "number") ? nf(big) : esc(String(big));
    return '<div class="kpi ' + cls + '"><p class="lbl">' + lbl + '</p><p class="big">' + shown + '</p><p class="sub">' + sub + '</p></div>';
  };
  var plan = stats.plannedFollowups || { total: 0, scheduled: 0, planned: 0, byDate: [] };
  var planSub = nf(plan.scheduled) + " scheduled (20 Nov) · " + nf(plan.planned) + " planned, not yet scheduled";
  var html = '<div class="kpis">' +
    kpi("", "Outreaches", t.outreaches, "first emails, to " + nf(t.companies) + " companies") +
    kpi("", "Follow-ups", t.followups, "sent in Oct–Nov, to " + nf(t.followupPeople) + " people") +
    kpi("", "Follow-ups planned in November", plan.total, planSub) +
    kpi("", "Warm contacts", t.warm, "Oct–Nov · will contact us when the need arises") +
    kpi("no", "Hard nos", t.hardNo, "replied not interested") +
    kpi("hot", "Expected RFQs", (stats.rfqExpected && stats.rfqExpected.expected) || "4\u20135", "currently pursuing") +
    '</div>';
  var PTD = ' style="text-align:right;border-top:1px solid var(--line);padding:.4rem 0"', PTL = ' style="padding:.4rem 0;border-top:1px solid var(--line)"';
  var kindLabel = { scheduled: "Scheduled", planned: "Planned (not yet scheduled)" };
  html += '<div class="sec"><div class="panel2"><h2>Follow-ups planned in November &middot; ' + nf(plan.total) + '</h2><p class="hint">16 follow-ups are already scheduled for 20 Nov. The others are drafts in the mailbox with a date prefix; they are planned but not yet scheduled.</p>' +
    '<table style="width:100%;border-collapse:collapse;font-size:.9rem"><tr style="color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase"><th style="text-align:left;font-weight:500">Date</th><th style="text-align:left;font-weight:500">Status</th><th style="text-align:right;font-weight:500">Count</th></tr>' +
    (plan.byDate || []).map(function (d) {
      var extra = d.window ? " (" + d.window + ")" : "";
      return '<tr><td' + PTL + '>' + esc(d.date) + extra + '</td><td' + PTL + '>' + esc(kindLabel[d.kind] || d.kind) + '</td><td' + PTD + '>' + nf(d.count) + '</td></tr>';
    }).join("") +
    '<tr><td' + PTL + '><b>Total</b></td><td' + PTL + '></td><td' + PTD + '><b>' + nf(plan.total) + '</b></td></tr></table></div></div>';
  html += '<div class="sec"><h2>Month by month</h2><p class="hint">October and November (to 17 Nov). Warm contacts are by month of the first warm reply. Hard nos are counted in the month of the reply.</p><div class="mgrid">' +
    '<div class="mcard"><h3>Outreaches</h3>' + bars(ms, "outreaches") + '</div>' +
    '<div class="mcard"><h3>Follow-ups</h3>' + bars(ms, "followups") + '</div>' +
    '<div class="mcard"><h3>Warm contacts · Oct–Nov</h3>' + bars(ms, "warm") + '</div>' +
    '<div class="mcard"><h3>Hard nos</h3>' + bars(ms, "hardNo") + '</div>' +
    '<div class="mcard"><h3>Expected RFQs</h3><p class="bignum">' + esc((stats.rfqExpected && stats.rfqExpected.expected) || "4\u20135") + '</p><p class="small">Currently pursuing. From electronica 2026: ' + esc((stats.rfqExpected && stats.rfqExpected.fromElectronica) || "2\u20133") + ' RFQs expected.</p></div></div></div>';
  var rx = stats.rfqExpected || { expected: "4\u20135", fromElectronica: "2\u20133" };
  html += '<div class="sec"><div class="rfqbox"><h2>Expected RFQs &middot; ' + esc(rx.expected) + '</h2><p class="hint">Currently pursuing.</p><p style="margin:.2rem 0 0;font-size:1.15rem">From electronica 2026: ' + esc(rx.fromElectronica) + ' RFQs expected.</p></div></div>';
  var TD = ' style="text-align:right;border-top:1px solid var(--line);padding:.4rem 0"', TL = ' style="padding:.4rem 0;border-top:1px solid var(--line)"';
  html += '<div class="sec"><div class="panel2"><h2>Warm contacts · Oct–Nov &middot; ' + nf(t.warm) + '</h2><p class="hint">' + (stats.warmScope ? esc(stats.warmScope) + '. ' : '') + '&ldquo;Will contact us when the need arises.&rdquo;</p>' +
    '<table style="width:100%;border-collapse:collapse;font-size:.9rem"><tr style="color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase"><th style="text-align:left;font-weight:500">Month of reply</th><th style="text-align:right;font-weight:500">Warm contacts</th></tr>' +
    ms.filter(function (m) { return m.warm != null; }).map(function (m) { return '<tr><td' + TL + '>' + esc(m.full) + '</td><td' + TD + '>' + m.warm + '</td></tr>'; }).join("") +
    '<tr><td' + TL + '><b>Total</b></td><td' + TD + '><b>' + t.warm + '</b></td></tr></table>' +
    '<div class="chips" style="margin-top:1.2rem">' +
    stats.warm.map(function (n) { return '<span class="chip' + (n === "Getinge" ? " get" : "") + '">' + esc(n) + '</span>'; }).join("") + '</div></div></div>';
  var HM = { oct: "October", nov: "November (to 17 Nov)" };
  html += '<div class="sec"><div class="panel2"><h2>Hard nos &middot; ' + nf(t.hardNo) + '</h2><p class="hint">Companies that replied that they are not interested. Not in the warm list.</p>' +
    ["oct", "nov"].map(function (k) {
      var l = stats.hardNoList[k] || [];
      return '<h4>' + esc(HM[k]) + ' (' + l.length + ')</h4><div class="chips">' + l.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join("") + '</div>';
    }).join("") + '</div></div>';
  html += '<div class="notes"><p>Totals count each company or person once, so they can be lower than the sum of the months.</p>' +
    '<p>About ' + nf(t.bounced) + ' outreach emails bounced and are counted as sent.</p>' +
    '<p>Replies are classified by hand and each company is in only one group. Replies from before October are not counted. Suppliers and competitors are excluded from all figures.</p></div>';
  body.innerHTML = html;
}
document.getElementById("gate").onsubmit = async function (e) {
  e.preventDefault();
  var status = document.getElementById("gate-status");
  status.textContent = "";
  var password = new FormData(e.target).get("password");
  var res = await fetch("/api/reporting", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({ password: password })
  });
  if (!res.ok) {
    status.textContent = "That password is not right.";
    return;
  }
  var data = await res.json();
  showReport(data.stats);
};
fetch("/api/reporting", { credentials: "same-origin" }).then(function (res) {
  if (res.ok) return res.json().then(function (data) { showReport(data.stats); });
});
</script>
</body></html>
